# The devcontainer, plus the Postgres the server needs, run by **rootless
# Podman** (`podman compose`; claude.sh, or VS Code with
# "dev.containers.dockerPath": "podman"). Compose rather than a
# plain image because the game library is mounted from a path that differs per
# machine (compose reads .env for it) and because Postgres is its own service.
# .env lives at the top of the repository; devcontainer.json's initializeCommand
# links it beside this file before any of this runs. See .env.example.
#
# An unset variable falls back to a path that exists and holds nothing, so the
# container still comes up and post-create reports the missing library
# explicitly.
#
# Every named volume has an explicit `name:` (bottom of the file): the compose
# project name the tooling picks differs between providers (docker-compose:
# `drop_devcontainer`, podman-compose: `dropdevcontainer`) and would otherwise
# prefix the volumes, so a provider switch would start from empty volumes --
# no login, no keys, no history.
#
# (server/.devcontainer/ is upstream's own, server-only devcontainer. It is left
# as it is so upstream syncs stay clean; this one covers the whole monorepo.)
services:
  dev:
    # Built from Dockerfile by initialize.sh on the host, not here: the dev
    # container tooling's own build goes through a generated Dockerfile outside
    # the build context, which Docker's buildx bake refuses outright. `never` so
    # a missing image is an error, not a pull of whatever someone else
    # published under this name.
    image: localhost/drop-devcontainer:latest
    pull_policy: never
    command: sleep infinity
    init: true
    depends_on:
      db:
        condition: service_healthy

    # Root in here, which rootless Podman maps to your own host user: files
    # written into the bind-mounted tree stay owned by you.

    environment:
      DROP_LIBRARY_DIR: ${DROP_LIBRARY_DIR:-}
      # The db service below, by its compose name. Set here, in the process
      # environment, so it wins over the host-oriented 127.0.0.1 URL in
      # server/.env: dotenv (prisma.config.ts) and Nuxt never override a
      # variable that is already set.
      DATABASE_URL: postgres://drop:drop@db:5432/drop
      # `pnpm dev` listens on 4000 (server/nuxt.config.ts devServer.port).
      EXTERNAL_URL: http://localhost:4000

    volumes:
      - ..:/workspaces/drop

      # **The user's own game library.** Drop ships no games; the server scans
      # this /{game}/{version}/... tree (server/server/internal/library/README.md).
      # Mounted at its own path so one value in .env is correct on the host and
      # in here alike; post-create.sh links server/.data/library (the server's
      # default LIBRARY) to it. Read-only by default: an input, never an output.
      - ${DROP_LIBRARY_DIR:-/var/empty}:${DROP_LIBRARY_DIR:-/var/empty}:${DROP_MOUNT_MODE:-ro}

      # The host's Wayland socket, so `pnpm tauri dev` and the nested session's
      # rootful Xwayland can open a window on your desktop. Renamed to a fixed
      # name; containerEnv points WAYLAND_DISPLAY at it. Deliberately no X11
      # socket and no Xauthority cookie: GTK and the nested session both speak
      # Wayland, and the tests use a headless Weston instead (post-create.sh).
      # Also deliberately no session D-Bus: it reaches the host's keyring.
      - ${XDG_RUNTIME_DIR:-/run/user/1000}/${WAYLAND_DISPLAY:-wayland-0}:/run/user/0/wayland-0

      # **Gamepads.** The client's frontend navigates by gamepad (the Deck's
      # game mode: main/composables/use-spatial-gamepad-nav.ts) through the Web
      # Gamepad API, which WebKitGTK reads from evdev via libmanette. The
      # directory is bound so a pad plugged in later appears; udev's database
      # is how libmanette tells a pad from a keyboard. Rootless Podman cannot
      # grant device access, and needs none here: systemd's uaccess rule
      # (70-uaccess.rules) gives the logged-in user an ACL on joystick nodes
      # only, and container root *is* that user. Keyboards and mice stay
      # root:input 0660 and unreadable in here -- deliberately: keeping the
      # host's `input` group (keep-groups, which also needs crun; this host
      # runs runc) would let anything in the container read every keystroke.
      - /dev/input:/dev/input
      - /run/udev:/run/udev:ro

      # **Not shared with the host's checkout**: every node_modules and .nuxt.
      # pnpm's store here can never be the host's, and on a store mismatch pnpm
      # purges node_modules before reinstalling (desktop/build_appimage.sh hit
      # exactly this), so a shared node_modules would wipe the host's installs.
      # .nuxt holds absolute paths, which differ between the host and
      # /workspaces/drop. One volume per pnpm workspace member
      # (pnpm-workspace.yaml) plus desktop/main, which build.mjs installs itself.
      - drop-nm-root:/workspaces/drop/node_modules
      - drop-nm-server:/workspaces/drop/server/node_modules
      - drop-nm-base:/workspaces/drop/libraries/base/node_modules
      - drop-nm-docs:/workspaces/drop/sites/docs/node_modules
      - drop-nm-promo:/workspaces/drop/sites/promo/node_modules
      - drop-nm-desktop:/workspaces/drop/desktop/node_modules
      - drop-nm-desktop-main:/workspaces/drop/desktop/main/node_modules
      - drop-nuxt-server:/workspaces/drop/server/.nuxt
      - drop-nuxt-base:/workspaces/drop/libraries/base/.nuxt
      - drop-nuxt-desktop-main:/workspaces/drop/desktop/main/.nuxt
      # The pnpm store and cargo's download caches, so a rebuilt container does
      # not fetch every package and crate again. (Build output is not here: it
      # goes to target-container/ in the tree, CARGO_TARGET_DIR.)
      - drop-pnpm-store:/root/.local/share/pnpm/store
      - drop-cargo-registry:/usr/local/cargo/registry
      - drop-cargo-git:/usr/local/cargo/git

      # Shell history across rebuilds.
      - drop-bashhistory:/commandhistory

      # Podman's images and layers. A volume, because overlay cannot stack on
      # this container's own overlay root; on a volume it is native overlay (no
      # fuse) and survives rebuilds.
      - drop-containers:/var/lib/containers

      # **No credential is bound in from the host.** No ~/.ssh, no ~/.gitconfig,
      # no Claude login: each of those is a volume the container owns and you
      # fill in once, from inside. A key generated or pasted in here stays here
      # and survives a rebuild, and a host key is never exposed to anything
      # running in the container. The one exception is your skills directory,
      # below, which is read-only and holds no secret.
      #
      # git's global config is a volume too, and containerEnv points
      # GIT_CONFIG_GLOBAL into it -- which is also what makes the copy of the
      # host's ~/.gitconfig that the Dev Containers extension drops in inert.
      # HTTP(S) push credentials are stored here too (credentials, set up by
      # the Dockerfile's credential.helper), so they survive rebuilds as well.
      - drop-ssh:/root/.ssh
      - drop-gitconfig:/root/.config/git
      # Claude Code's credentials, settings and per-project history.
      - drop-claude:/root/.claude
      # Your own skills, read-only, over the volume above. The shorter path is
      # mounted first, so this lands inside the volume.
      - ${HOME}/.claude/skills:/root/.claude/skills:ro
      # Your installed plugins, read-only, the same way: install and update them
      # on the host. Mounted twice because installed_plugins.json and
      # known_marketplaces.json record absolute host paths -- the host path makes
      # those resolve, the /root one is where CLAUDE_CONFIG_DIR looks for the
      # manifests. enable-plugins.sh enables each in this container's settings.
      - ${HOME}/.claude/plugins:/root/.claude/plugins:ro
      - ${HOME}/.claude/plugins:${HOME}/.claude/plugins:ro
      # Plugins' own persistent state (CLAUDE_PLUGIN_DATA) must be writable, and
      # is the container's, never the host's.
      - drop-claude-plugindata:/root/.claude/plugins/data

    # The GPU, for WebKit's renderer and the nested session's Xwayland (glamor).
    # Without it Mesa falls back to llvmpipe. Opened through the same uaccess
    # ACL as the gamepads (card* is root:video 0660 plus an ACL for you).
    devices:
      - /dev/dri:/dev/dri
    # **Podman, so container builds work in here** (Dockerfile). The host's
    # Podman is rootless: these apply inside the user namespace it gives us,
    # never to the host. SYS_ADMIN is for podman's mounts and namespaces;
    # seccomp=unconfined because the default profile still denies crun's
    # pivot_root and keyctl; label=disable because SELinux labels would deny
    # the bind mounts where SELinux is enforcing. No container socket, no
    # --privileged.
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp=unconfined
      - label=disable

  # The same Postgres as server/dev-tools/compose.yml. Not published on a host
  # port: only the dev service talks to it, and that way it cannot collide with
  # a host-side instance of that compose file on 5432.
  #
  # Runs in Podman's default rootless user namespace, which maps the image's
  # postgres user exactly as rootless Docker did, so the moved pgdata volume
  # keeps working. Fully qualified, so no short-name lookup is needed.
  db:
    image: docker.io/library/postgres:14-alpine
    environment:
      POSTGRES_USER: drop
      POSTGRES_PASSWORD: drop
      POSTGRES_DB: drop
    volumes:
      - drop-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drop -d drop"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  drop-containers:
    name: drop-containers
  drop-nm-root:
    name: drop-nm-root
  drop-nm-server:
    name: drop-nm-server
  drop-nm-base:
    name: drop-nm-base
  drop-nm-docs:
    name: drop-nm-docs
  drop-nm-promo:
    name: drop-nm-promo
  drop-nm-desktop:
    name: drop-nm-desktop
  drop-nm-desktop-main:
    name: drop-nm-desktop-main
  drop-nuxt-server:
    name: drop-nuxt-server
  drop-nuxt-base:
    name: drop-nuxt-base
  drop-nuxt-desktop-main:
    name: drop-nuxt-desktop-main
  drop-pnpm-store:
    name: drop-pnpm-store
  drop-cargo-registry:
    name: drop-cargo-registry
  drop-cargo-git:
    name: drop-cargo-git
  drop-bashhistory:
    name: drop-bashhistory
  drop-ssh:
    name: drop-ssh
  drop-gitconfig:
    name: drop-gitconfig
  drop-claude:
    name: drop-claude
  drop-claude-plugindata:
    name: drop-claude-plugindata
  drop-pgdata:
    name: drop-pgdata
