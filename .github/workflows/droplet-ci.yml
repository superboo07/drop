name: Droplet CI

on:
  push:
    branches: [develop]
    paths:
      - "libraries/droplet/**"
      - "libraries/droplet_types/**"
      - "libraries/libarchive/**"
      - ".github/workflows/droplet-ci.yml"
      - "deny.toml"
  pull_request:
    branches: [develop]
    paths:
      - "libraries/droplet/**"
      - "libraries/droplet_types/**"
      - "libraries/libarchive/**"
      - ".github/workflows/droplet-ci.yml"
      - "deny.toml"
  workflow_dispatch:
  # So a newly published advisory is caught even when nothing has changed.
  schedule:
    - cron: "17 6 * * 1"

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: Build, Test, Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libraries/droplet
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./libraries/droplet -> target"

      - name: Install libarchive
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-dev

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy (lint)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features --all --verbose

  advisories:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Fails on a RustSec advisory against anything droplet links. Runs on a
      # schedule as well as on changes, because an advisory can be published
      # against a lockfile that hasn't moved. Accept one that doesn't apply
      # with `[advisories] ignore` in deny.toml.
      - name: Check advisories
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: libraries/droplet/Cargo.toml
          arguments: --config deny.toml
          command: check advisories
