name: Torrential CI

on:
  push:
    branches: [develop]
    paths:
      - "torrential/**"
      - "libraries/droplet/**"
      - "libraries/droplet_types/**"
      - "libraries/libarchive/**"
      - ".github/workflows/torrential-ci.yml"
      - "deny.toml"
  pull_request:
    branches: [develop]
    paths:
      - "torrential/**"
      - "libraries/droplet/**"
      - "libraries/droplet_types/**"
      - "libraries/libarchive/**"
      - ".github/workflows/torrential-ci.yml"
      - "deny.toml"
  workflow_dispatch:
  # So a newly published advisory is caught even when nothing has changed.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: torrential
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./torrential -> target"

      # Required by the droplet-rs path dependency (libarchive bindings).
      - name: Install libarchive
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-dev

      - name: Build
        run: cargo build --all-targets --verbose

      - name: Run tests
        run: cargo test --verbose

  advisories:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Fails on a RustSec advisory against anything torrential links. Runs on a
      # schedule as well as on changes, because an advisory can be published
      # against a lockfile that hasn't moved. Accept one that doesn't apply
      # with `[advisories] ignore` in deny.toml.
      - name: Check advisories
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: torrential/Cargo.toml
          arguments: --config deny.toml
          command: check advisories
