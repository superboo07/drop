name: "build appimage"

on: push

# Builds the Linux AppImage inside Docker (bash build_appimage.sh / Dockerfile.build)
# on every commit and uploads it as a workflow artifact, so any push has a
# downloadable, testable AppImage without cutting a release. build_appimage.sh
# names the output after the commit it was built from -- that's the single
# place the naming scheme lives, so it isn't duplicated here.
# See release.yml for the version-tagged release build.

jobs:
  build-appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: superboo07/drop-app
          submodules: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build AppImage
        run: bash build_appimage.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: drop-app-${{ github.sha }}
          path: "*.AppImage"
