# picom configuration for Drop's nested session.
#
# picom is here for one thing: translucency. X11 has no alpha blending
# without a compositing manager, and Qt (so LunaTranslator) only even tries
# to draw a see-through window once something owns _NET_WM_CM_S<screen> -
# which picom claims on startup.
#
# Built without OpenGL (desktop/vendor/build.sh), so the backend is xrender.
# Inside a rootful Xwayland that's still GPU work: Xwayland implements
# RENDER with glamor.

backend = "xrender";
vsync = true;
use-damage = true;

# Not effects - a game and a translator, not a desktop.
shadow = false;
fading = false;

# Unredirecting a fullscreen game would save a copy per frame, but the
# taskbar and any always-on-top LunaTranslator window stack over a
# fullscreen game in this session, so there's rarely a moment it applies -
# and each toggle between the two modes flashes the screen.
unredir-if-possible = false;

# Qt and Wine both set opacity on the client window, not the frame openbox
# wraps it in.
detect-client-opacity = true;
detect-transient = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
use-ewmh-active-win = true;

log-level = "warn";
