packages:
  - "server/"
  - "libraries/base/"
  - "sites/*"
  - "desktop/"

# Dependencies allowed to run install scripts; everything else is blocked.
allowBuilds:
  "@bufbuild/buf": true
  "@parcel/watcher": true
  "@prisma/client": true
  "@prisma/engines": true
  "@tailwindcss/oxide": true
  argon2: true
  contentlayer: true
  contentlayer2: true
  esbuild: true
  optipng-bin: true
  pngquant-bin: true
  prisma: true
  protobufjs: true
  sharp: true
  tauri: true
  unrs-resolver: true
  zopflipng-bin: true

overrides:
  "@isaacs/brace-expansion@<=5.0.0": ">=5.0.1"
  ajv@<6.14.0: ">=6.14.0"
  devalue@<=5.6.2: ">=5.6.3"
  devalue@>=5.1.0 <5.6.2: ">=5.6.2"
  devalue@>=5.3.0 <=5.6.1: ">=5.6.2"
  diff@>=6.0.0 <8.0.3: ">=8.0.3"
  hono@<4.11.10: ">=4.11.10"
  hono@<4.11.7: ">=4.11.7"
  lodash-es@>=4.0.0 <=4.17.22: ">=4.17.23"
  lodash@>=4.0.0 <=4.17.22: ">=4.17.23"
  minimatch@<3.1.3: ">=3.1.3"
  minimatch@<3.1.4: ">=3.1.4"
  minimatch@>=10.0.0 <10.2.1: ">=10.2.1"
  minimatch@>=10.0.0 <10.2.3: ">=10.2.3"
  minimatch@>=5.0.0 <5.1.7: ">=5.1.7"
  minimatch@>=5.0.0 <5.1.8: ">=5.1.8"
  minimatch@>=9.0.0 <9.0.6: ">=9.0.6"
  minimatch@>=9.0.0 <9.0.7: ">=9.0.7"
  node-forge@<1.3.2: ">=1.3.2"
  qs@<6.14.1: ">=6.14.1"
  qs@>=6.7.0 <=6.14.1: ">=6.14.2"
  rollup@>=4.0.0 <4.59.0: ">=4.59.0"
  serialize-javascript@<=7.0.2: ">=7.0.3"
  seroval@<1.4.1: ">=1.4.1"
  seroval@<=1.4.0: ">=1.4.1"
  tar@<7.5.7: ">=7.5.7"
  tar@<7.5.8: ">=7.5.8"
  tar@<=7.5.2: ">=7.5.3"
  tar@<=7.5.3: ">=7.5.4"
  undici@>=7.0.0 <7.18.2: ">=7.18.2"
  # Bounded to their current majors: an open ">=" would jump to the next
  # major (undici 8, devalue 6, deepmerge-ts 9) on the next re-resolve.
  undici@>=7.0.0 <7.29.0: ^7.29.0
  devalue@<5.9.2: ^5.9.2
  # stream-mime-type 2.0.0 is the latest and still asks for file-type ^18;
  # it only calls fileTypeFromBuffer, which 21 keeps.
  stream-mime-type>file-type: ^21.3.1
  # prisma pins these exactly, even in 7.10. Mirrored in
  # server/build/prisma-cli/pnpm-workspace.yaml for the runtime image's CLI.
  "@hono/node-server@<1.19.15": ^1.19.15
  deepmerge-ts@<8.0.0: ^8.0.0
  mysql2@<3.23.1: ^3.23.1
  valibot@<1.4.2: ^1.4.2

  cross-spawn@<6.0.6: ">=6.0.6"
  cross-spawn@>=7.0.0 <7.0.5: ">=7.0.5"
  form-data@<2.5.4: ">=2.5.4"
  got@<11.8.5: ">=11.8.5"
  http-cache-semantics@<4.1.1: ">=4.1.1"
  lodash@<4.17.21: ">=4.17.21"
  lodash@>=4.0.0 <4.17.21: ">=4.17.21"
  minimist@>=1.0.0 <1.2.6: ">=1.2.6"
  nth-check@<2.0.1: ">=2.0.1"
  semver-regex@<3.1.3: ">=3.1.3"
  semver-regex@<3.1.4: ">=3.1.4"
  semver@>=7.0.0 <7.5.2: ">=7.5.2"
  sharp@<0.30.5: ">=0.30.5"
  sharp@<0.32.6: ">=0.32.6"
  tmp@<=0.2.3: ">=0.2.4"
  tough-cookie@<4.1.3: ">=4.1.3"
  trim-newlines@<3.0.1: ">=3.0.1"

auditConfig:
  ignoreGhsas:
    # node-forge: RSA PKCS#1 v1.5 signature verification. No fixed release
    # (1.4.0 is affected). Only via listhen, which makes self-signed
    # certificates for `nuxt dev --https`.
    - GHSA-86w9-cpqp-85rv
    # braces: stack exhaustion from deeply nested patterns. No fixed release
    # (3.0.3 is affected). Only via build-time globbing (nitropack, the i18n
    # module's router plugin) on the patterns in our own config.
    - GHSA-vfj7-8cjw-p6xm
    # simple-git / @simple-git/argv-parser: fixed in simple-git 4.0.1, and
    # @nuxt/devtools 3.4.3 drops simple-git altogether, but that release is
    # newer than pnpm's minimum release age allows. Only used by the DevTools
    # panel in `nuxt dev`, never in a built server. Remove once
    # `pnpm up -r @nuxt/devtools` picks up 3.4.3.
    - GHSA-x6jw-m9v5-85vh
    - GHSA-g4wm-2vf7-vfgr
    - GHSA-858h-whjf-mvg5
    - GHSA-v5rq-49vh-5v5c

shamefullyHoist: true
