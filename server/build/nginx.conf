worker_processes  1;

events {
    worker_connections  1024;
}

pid nginx.pid;
error_log stderr;
daemon off;

http {
    default_type  application/octet-stream;

    sendfile        on;
    server_tokens off;
    
    access_log nginx_host.access.log;
    client_body_temp_path client_body;
    fastcgi_temp_path fastcgi_temp;
    proxy_temp_path proxy_temp;
    scgi_temp_path scgi_temp;
    uwsgi_temp_path uwsgi_temp;

    proxy_buffering off;    

    server {
        listen       3000;
        server_name  localhost;

        location / {
                proxy_pass http://localhost:4000;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
        }

        # Websockets sit idle between messages (a task page waiting on its
        # next log line, notifications), and nginx closes a proxied
        # connection after 60s without one. The pages reconnect, but
        # shouldn't have to every minute.
        location ~ ^/api/v1/(task|notifications/ws|admin/system-data/ws|client/auth/code/ws)$ {
                proxy_pass http://localhost:4000;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_read_timeout 1h;
                proxy_send_timeout 1h;
        }

        # Desktop client builds (~150MB AppImages) are streamed straight to
        # disk by the Node server; nginx's default 1MB body cap and request
        # buffering would reject or spool them first.
        location = /api/v1/admin/updater/upload {
                proxy_pass http://localhost:4000;
                proxy_http_version 1.1;
                client_max_body_size 0;
                proxy_request_buffering off;
                proxy_read_timeout 600s;
        }

        location /api/v1/depot/ {
                proxy_pass http://localhost:5000;
                proxy_read_timeout 300s;
                proxy_connect_timeout 75s;
        }
    }
}
